<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML5 테트리스</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --panel: rgba(15, 23, 42, 0.82);
      --line: rgba(148, 163, 184, 0.24);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, #334155 0%, transparent 45%),
        radial-gradient(circle at 80% 10%, #0ea5e9 0%, transparent 33%),
        radial-gradient(circle at 70% 85%, #f59e0b 0%, transparent 28%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      overflow: hidden;
    }

    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .game-shell {
      width: min(940px, 100%);
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      align-items: start;
    }

    .board-panel,
    .side-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .board-panel {
      display: grid;
      place-items: center;
      padding: 16px;
      position: relative;
    }

    #game {
      width: min(100%, 420px);
      aspect-ratio: 10 / 20;
      image-rendering: pixelated;
      border: 2px solid rgba(148, 163, 184, 0.4);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.85), rgba(15, 23, 42, 0.95));
    }

    .overlay {
      position: absolute;
      inset: 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 0.18s ease, transform 0.18s ease;
      background: rgba(2, 6, 23, 0.64);
      border: 1px solid rgba(148, 163, 184, 0.26);
    }

    .overlay.show {
      opacity: 1;
      transform: scale(1);
    }

    .overlay h2 {
      margin: 0 0 10px;
      font-size: 1.8rem;
      color: #fde68a;
    }

    .overlay p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .side-panel {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .title {
      margin: 0;
      font-size: clamp(1.2rem, 2.2vw, 1.55rem);
      letter-spacing: 0.4px;
      font-weight: 700;
      color: #fde68a;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.5);
    }

    .stat .label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    .stat .value {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .preview-box {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.5);
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    #next {
      width: 100%;
      max-width: 140px;
      margin: 0 auto;
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(2, 6, 23, 0.85);
    }

    .controls {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .btn-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button {
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fff7ed;
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.85), rgba(217, 119, 6, 0.86));
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
      filter: brightness(0.96);
    }

    .touch {
      display: none;
      gap: 8px;
      grid-template-columns: repeat(4, 1fr);
    }

    .touch button {
      padding: 10px 0;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .game-shell {
        grid-template-columns: 1fr;
        max-width: 520px;
      }

      .touch {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="game-shell">
      <section class="board-panel">
        <canvas id="game" width="300" height="600" aria-label="테트리스 보드"></canvas>
        <div id="overlay" class="overlay show" aria-live="polite">
          <div>
            <h2>테트리스</h2>
            <p>시작 버튼 또는 Enter 키를 누르세요.</p>
          </div>
        </div>
      </section>

      <aside class="side-panel">
        <h1 class="title">HTML5 Tetris</h1>
        <p class="subtitle">한 파일로 만든 테트리스 게임입니다. 브라우저에서 바로 실행됩니다.</p>

        <section class="stat-grid">
          <article class="stat">
            <span class="label">점수</span>
            <span id="score" class="value">0</span>
          </article>
          <article class="stat">
            <span class="label">라인</span>
            <span id="lines" class="value">0</span>
          </article>
          <article class="stat">
            <span class="label">레벨</span>
            <span id="level" class="value">1</span>
          </article>
        </section>

        <section class="preview-box">
          <strong>다음 블록</strong>
          <canvas id="next" width="120" height="120" aria-label="다음 블록"></canvas>
        </section>

        <ul class="controls">
          <li>좌/우: 이동</li>
          <li>아래: 소프트 드롭</li>
          <li>위 또는 X: 회전</li>
          <li>Z: 반대 회전</li>
          <li>스페이스: 하드 드롭</li>
          <li>P: 일시정지</li>
        </ul>

        <div class="btn-row">
          <button id="startBtn" type="button">시작 / 재시작</button>
          <button id="pauseBtn" type="button">일시정지</button>
        </div>

        <div class="touch" aria-label="터치 버튼">
          <button data-key="ArrowLeft" type="button">◀</button>
          <button data-key="ArrowRight" type="button">▶</button>
          <button data-key="ArrowDown" type="button">▼</button>
          <button data-key="ArrowUp" type="button">⟳</button>
        </div>
      </aside>
    </main>
  </div>

  <script>
    (() => {
      const COLS = 10;
      const ROWS = 20;
      const BLOCK = 30;

      const COLORS = {
        I: "#22d3ee",
        O: "#facc15",
        T: "#a78bfa",
        S: "#34d399",
        Z: "#fb7185",
        J: "#60a5fa",
        L: "#fb923c"
      };

      const SHAPES = {
        I: [[1, 1, 1, 1]],
        O: [[1, 1], [1, 1]],
        T: [[0, 1, 0], [1, 1, 1]],
        S: [[0, 1, 1], [1, 1, 0]],
        Z: [[1, 1, 0], [0, 1, 1]],
        J: [[1, 0, 0], [1, 1, 1]],
        L: [[0, 0, 1], [1, 1, 1]]
      };

      const boardCanvas = document.getElementById("game");
      const boardCtx = boardCanvas.getContext("2d");
      const nextCanvas = document.getElementById("next");
      const nextCtx = nextCanvas.getContext("2d");

      const scoreEl = document.getElementById("score");
      const linesEl = document.getElementById("lines");
      const levelEl = document.getElementById("level");
      const overlayEl = document.getElementById("overlay");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");

      let board = createBoard();
      let current = null;
      let next = null;
      let score = 0;
      let lines = 0;
      let level = 1;
      let dropCounter = 0;
      let dropInterval = 800;
      let lastTime = 0;
      let gameOver = false;
      let paused = false;
      let started = false;

      function createBoard() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      }

      function randomPiece() {
        const keys = Object.keys(SHAPES);
        const type = keys[Math.floor(Math.random() * keys.length)];
        return {
          type,
          matrix: SHAPES[type].map((row) => row.slice()),
          x: Math.floor(COLS / 2) - 1,
          y: 0
        };
      }

      function resetGame() {
        board = createBoard();
        score = 0;
        lines = 0;
        level = 1;
        dropInterval = 800;
        dropCounter = 0;
        lastTime = 0;
        gameOver = false;
        paused = false;
        started = true;

        current = randomPiece();
        next = randomPiece();
        centerCurrentPiece();
        updateStats();
        updateOverlay("", "", false);
      }

      function centerCurrentPiece() {
        current.x = Math.floor((COLS - current.matrix[0].length) / 2);
      }

      function collide(piece, offsetX = 0, offsetY = 0, matrix = piece.matrix) {
        for (let y = 0; y < matrix.length; y++) {
          for (let x = 0; x < matrix[y].length; x++) {
            if (!matrix[y][x]) {
              continue;
            }
            const nx = piece.x + x + offsetX;
            const ny = piece.y + y + offsetY;
            if (nx < 0 || nx >= COLS || ny >= ROWS) {
              return true;
            }
            if (ny >= 0 && board[ny][nx]) {
              return true;
            }
          }
        }
        return false;
      }

      function merge(piece) {
        piece.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value && piece.y + y >= 0) {
              board[piece.y + y][piece.x + x] = piece.type;
            }
          });
        });
      }

      function clearLines() {
        let cleared = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
          if (board[y].every((cell) => cell !== 0)) {
            board.splice(y, 1);
            board.unshift(Array(COLS).fill(0));
            cleared++;
            y++;
          }
        }

        if (cleared > 0) {
          const table = [0, 100, 300, 500, 800];
          score += table[cleared] * level;
          lines += cleared;
          level = Math.floor(lines / 10) + 1;
          dropInterval = Math.max(120, 800 - (level - 1) * 60);
          updateStats();
        }
      }

      function spawn() {
        current = next;
        next = randomPiece();
        current.y = 0;
        centerCurrentPiece();

        if (collide(current)) {
          gameOver = true;
          started = false;
          updateOverlay("게임 오버", "재시작 버튼 또는 Enter 키를 누르세요.", true);
        }
      }

      function rotateMatrix(matrix, dir) {
        const transposed = matrix[0].map((_, i) => matrix.map((row) => row[i]));
        return dir > 0 ? transposed.map((row) => row.reverse()) : transposed.reverse();
      }

      function rotate(dir) {
        const rotated = rotateMatrix(current.matrix, dir);
        const oldX = current.x;
        let offset = 1;

        while (collide(current, 0, 0, rotated)) {
          current.x += offset;
          offset = -(offset + (offset > 0 ? 1 : -1));
          if (Math.abs(offset) > current.matrix[0].length + 1) {
            current.x = oldX;
            return;
          }
        }

        current.matrix = rotated;
      }

      function hardDrop() {
        while (!collide(current, 0, 1)) {
          current.y++;
          score += 2;
        }
        lockPiece();
        updateStats();
      }

      function lockPiece() {
        merge(current);
        clearLines();
        spawn();
      }

      function updateStats() {
        scoreEl.textContent = String(score);
        linesEl.textContent = String(lines);
        levelEl.textContent = String(level);
      }

      function updateOverlay(title, desc, show) {
        overlayEl.innerHTML = show
          ? `<div><h2>${title}</h2><p>${desc}</p></div>`
          : "";
        overlayEl.classList.toggle("show", show);
      }

      function drawCell(ctx, x, y, color, size) {
        const px = x * size;
        const py = y * size;
        ctx.fillStyle = color;
        ctx.fillRect(px, py, size, size);

        ctx.strokeStyle = "rgba(15, 23, 42, 0.55)";
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, size - 1, size - 1);

        ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
        ctx.fillRect(px + 2, py + 2, size - 4, Math.max(3, size * 0.16));
      }

      function drawBoard() {
        boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const cell = board[y][x];
            if (cell) {
              drawCell(boardCtx, x, y, COLORS[cell], BLOCK);
            }
          }
        }

        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            boardCtx.strokeStyle = "rgba(148, 163, 184, 0.08)";
            boardCtx.strokeRect(x * BLOCK + 0.5, y * BLOCK + 0.5, BLOCK, BLOCK);
          }
        }

        if (!current) {
          return;
        }

        current.matrix.forEach((row, y) => {
          row.forEach((v, x) => {
            if (v) {
              drawCell(boardCtx, current.x + x, current.y + y, COLORS[current.type], BLOCK);
            }
          });
        });
      }

      function drawNext() {
        nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (!next) {
          return;
        }

        const matrix = next.matrix;
        const size = Math.floor(nextCanvas.width / 5);
        const offsetX = Math.floor((5 - matrix[0].length) / 2);
        const offsetY = Math.floor((5 - matrix.length) / 2);

        matrix.forEach((row, y) => {
          row.forEach((v, x) => {
            if (v) {
              drawCell(nextCtx, x + offsetX, y + offsetY, COLORS[next.type], size);
            }
          });
        });
      }

      function tick(time = 0) {
        if (!started) {
          drawBoard();
          drawNext();
          requestAnimationFrame(tick);
          return;
        }

        const delta = time - lastTime;
        lastTime = time;

        if (!paused && !gameOver) {
          dropCounter += delta;
          if (dropCounter > dropInterval) {
            if (!collide(current, 0, 1)) {
              current.y++;
              score += 1;
            } else {
              lockPiece();
            }
            dropCounter = 0;
            updateStats();
          }
        }

        drawBoard();
        drawNext();
        requestAnimationFrame(tick);
      }

      function move(dir) {
        if (!started || paused || gameOver) {
          return;
        }
        if (!collide(current, dir, 0)) {
          current.x += dir;
        }
      }

      function softDrop() {
        if (!started || paused || gameOver) {
          return;
        }
        if (!collide(current, 0, 1)) {
          current.y++;
          score += 1;
          updateStats();
        } else {
          lockPiece();
        }
        dropCounter = 0;
      }

      function togglePause() {
        if (!started || gameOver) {
          return;
        }
        paused = !paused;
        if (paused) {
          updateOverlay("일시정지", "P 키 또는 버튼으로 계속", true);
        } else {
          updateOverlay("", "", false);
        }
      }

      function start() {
        resetGame();
      }

      function handleKey(e) {
        if (e.key === "Enter" && !started) {
          start();
          return;
        }

        if (e.key === "p" || e.key === "P") {
          togglePause();
          return;
        }

        if (!started || paused || gameOver) {
          return;
        }

        switch (e.key) {
          case "ArrowLeft":
            move(-1);
            break;
          case "ArrowRight":
            move(1);
            break;
          case "ArrowDown":
            softDrop();
            break;
          case "ArrowUp":
          case "x":
          case "X":
            rotate(1);
            break;
          case "z":
          case "Z":
            rotate(-1);
            break;
          case " ":
            hardDrop();
            break;
          default:
            break;
        }
      }

      document.addEventListener("keydown", handleKey);

      startBtn.addEventListener("click", start);
      pauseBtn.addEventListener("click", togglePause);

      document.querySelectorAll(".touch button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-key");
          if (key === "ArrowLeft") {
            move(-1);
          } else if (key === "ArrowRight") {
            move(1);
          } else if (key === "ArrowDown") {
            softDrop();
          } else if (key === "ArrowUp") {
            rotate(1);
          }
        });
      });

      updateStats();
      drawBoard();
      drawNext();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
